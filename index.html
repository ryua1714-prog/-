<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>子育てタイプ診断</title>
  <meta name="description" content="30の質問に答えて、あなたの子育てタイプを8つのタイプで診断します。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">

    <!-- スタート画面 -->
    <section id="screen-start" class="screen active">
      <div class="hero">
        <div class="hero-animals" aria-hidden="true">🦉🐈🐴🐒🐕🐨🐯🦊</div>
        <h1>子育てタイプ診断</h1>
        <p class="lead">30の質問に答えて、あなたが子育てで大切にしている価値観を8つのタイプで診断します。</p>
        <ul class="hero-notes">
          <li>全30問・所要時間は約3分</li>
          <li>直感で、いちばん近いものを選んでください</li>
        </ul>
        <button id="btn-start" class="btn-primary" type="button">診断をはじめる</button>
      </div>
    </section>

    <!-- 質問画面 -->
    <section id="screen-question" class="screen" aria-live="polite">
      <div class="progress">
        <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
        <span id="progress-text" class="progress-text"></span>
      </div>
      <div id="question-card" class="question-card">
        <p id="q-number" class="q-number"></p>
        <h2 id="q-text" class="q-text"></h2>
        <div id="choices" class="choices"></div>
      </div>
      <button id="btn-back" class="btn-text" type="button">← 前の質問に戻る</button>
    </section>

    <!-- 均一回答の確認画面 -->
    <section id="screen-notice" class="screen">
      <div class="notice-card">
        <div class="notice-icon" aria-hidden="true">💡</div>
        <p>回答の傾向がかなり均一でした。</p>
        <p>より自分に近い結果を出したい場合は、<br>“理想の親ならどう答えるか”ではなく、<br>普段の自分ならどうするかを基準に答えるのがおすすめです。</p>
        <button id="btn-notice-continue" class="btn-primary" type="button">このまま結果を見る</button>
        <button id="btn-notice-review" class="btn-secondary" type="button">回答を見直す</button>
      </div>
    </section>

    <!-- 同点時の二択質問 -->
    <section id="screen-tiebreak" class="screen" aria-live="polite">
      <p class="tiebreak-lead">あと1問だけ答えてください</p>
      <div id="tiebreak-card" class="question-card">
        <h2 id="t-text" class="q-text"></h2>
        <div id="t-choices" class="choices"></div>
      </div>
    </section>

    <!-- 結果画面 -->
    <section id="screen-result" class="screen">
      <div class="result-head">
        <div class="result-illust" aria-hidden="true"><span id="r-emoji" class="result-emoji"></span></div>
        <p class="result-caption">あなたは</p>
        <h2 class="result-title"><span id="r-label"></span><span class="sep">｜</span><span id="r-role"></span></h2>
        <div class="result-values">
          <span class="values-label">価値観</span>
          <div id="r-values" class="value-tags"></div>
        </div>
      </div>

      <div class="card">
        <h3 class="card-title">子育てバランス</h3>
        <div id="r-chart" class="chart"></div>
      </div>

      <div class="card">
        <h3 class="card-title">どんなタイプ？</h3>
        <div id="r-about" class="card-body"></div>
      </div>

      <div class="card">
        <h3 class="card-title">どんな子どもに育ちやすい？</h3>
        <div id="r-child" class="card-body"></div>
      </div>

      <div class="card">
        <h3 class="card-title">どんなことに気をつける？</h3>
        <div id="r-caution" class="card-body"></div>
      </div>

      <button id="btn-retry" class="btn-primary" type="button">もう一度診断する</button>
    </section>

  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
